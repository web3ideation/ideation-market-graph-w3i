specVersion: 0.0.4
schema:
  file: ./schema.graphql

dataSources:
  # -------- Marketplace facet (no whitelist events here) --------
  - kind: ethereum
    name: IdeationMarketDiamond
    network: sepolia
    source:
      address: "0x8cE90712463c87a6d62941D67C3507D090Ea9d79"
      abi: IdeationMarketFacet
      startBlock: 9263094
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Listing
      abis:
        - name: IdeationMarketFacet
          file: ./abis/IdeationMarketFacet.json
      eventHandlers:
        - event: ListingCreated(indexed uint128,indexed address,indexed uint256,uint256,uint256,address,uint32,address,bool,bool,address,uint256,uint256)
          handler: handleListingCreated
        - event: ListingUpdated(indexed uint128,indexed address,indexed uint256,uint256,uint256,address,uint32,address,bool,bool,address,uint256,uint256)
          handler: handleListingUpdated
        - event: ListingPurchased(indexed uint128,indexed address,indexed uint256,uint256,bool,uint256,address,uint32,address,address,address,uint256,uint256)
          handler: handleListingPurchased
        - event: ListingCanceled(indexed uint128,indexed address,indexed uint256,address,address)
          handler: handleListingCanceled
        - event: ListingCanceledDueToInvalidListing(indexed uint128,indexed address,indexed uint256,address,address)
          handler: handleListingInvalidated
        - event: InnovationFeePaid(indexed uint128,indexed address,indexed address,uint256)
          handler: handleInnovationFeePaid
        - event: RoyaltyPaid(indexed uint128,indexed address,indexed address,uint256)
          handler: handleRoyaltyPaid
        - event: SellerProceedsPaid(indexed uint128,indexed address,indexed address,uint256)
          handler: handleSellerProceedsPaid
      file: ./src/mapping.ts

  # -------- Buyer whitelist facet (same address, different ABI) --------
  - kind: ethereum
    name: BuyerWhitelist
    network: sepolia
    source:
      address: "0x8cE90712463c87a6d62941D67C3507D090Ea9d79"
      abi: BuyerWhitelistFacet
      startBlock: 9263094
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WhitelistedBuyer
      abis:
        - name: BuyerWhitelistFacet
          file: ./abis/BuyerWhitelistFacet.json
      eventHandlers:
        - event: BuyerWhitelisted(indexed uint128,indexed address)
          handler: handleBuyerWhitelisted
        - event: BuyerRemovedFromWhitelist(indexed uint128,indexed address)
          handler: handleBuyerRemovedFromWhitelist
      file: ./src/mapping.ts

  # -------- Collection whitelist facet (same address, different ABI) --------
  - kind: ethereum
    name: CollectionWhitelist
    network: sepolia
    source:
      address: "0x8cE90712463c87a6d62941D67C3507D090Ea9d79"
      abi: CollectionWhitelistFacet
      startBlock: 9263094
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WhitelistedCollection
      abis:
        - name: CollectionWhitelistFacet
          file: ./abis/CollectionWhitelistFacet.json
      eventHandlers:
        - event: CollectionAddedToWhitelist(indexed address)
          handler: handleCollectionAddedToWhitelist
        - event: CollectionRemovedFromWhitelist(indexed address)
          handler: handleCollectionRemovedFromWhitelist
      file: ./src/mapping.ts

  # -------- Currency whitelist facet (same address, different ABI) --------
  - kind: ethereum
    name: CurrencyWhitelist
    network: sepolia
    source:
      address: "0x8cE90712463c87a6d62941D67C3507D090Ea9d79"
      abi: CurrencyWhitelistFacet
      startBlock: 9263094
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AllowedCurrency
      abis:
        - name: CurrencyWhitelistFacet
          file: ./abis/CurrencyWhitelistFacet.json
      eventHandlers:
        - event: CurrencyAllowed(indexed address)
          handler: handleCurrencyAllowed
        - event: CurrencyRemoved(indexed address)
          handler: handleCurrencyRemoved
      file: ./src/mapping.ts
